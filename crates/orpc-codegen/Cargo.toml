[package]
name = "orpc-codegen"
version = "0.1.0"
edition = "2021"
authors = ["rust-orpc contributors"]
license = "MIT OR Apache-2.0"
description = "TypeScript contract and Zod schema generation for orpc"
repository = "https://github.com/yourusername/rust-orpc"
keywords = ["codegen", "typescript", "zod", "rpc"]
categories = ["development-tools"]

[dependencies]
serde        = { version = "1.0", features = ["derive"] }
