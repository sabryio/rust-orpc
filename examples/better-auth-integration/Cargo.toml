[package]
name = "better-auth-orpc-example"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors"] }

# orpc
orpc-core = { path = "../../crates/orpc-core" }
orpc-axum = { path = "../../crates/orpc-axum" }

# Better Auth RS (using alpha version)
better-auth = { version = "1.0.0-alpha.2", features = ["axum", "seaorm2"] }

# Utilities
chrono = "0.4"
