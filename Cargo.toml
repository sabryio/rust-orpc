[workspace]
members = [
    "crates/rorpc",
    "crates/rorpc-macros",
    "crates/rorpc-parse",
    "examples/axum-react/server",
    "examples/axum-react/better-auth-integration",
]
# Examples are excluded from publishing — they are not crates.io packages
exclude = [
    "examples/axum-react/server",
    "examples/axum-react/better-auth-integration",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["rorpc contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/rorpc"
homepage = "https://github.com/yourusername/rorpc"

[workspace.dependencies]
rorpc = { path = "crates/rorpc", version = "0.1.0" }
rorpc-macros = { path = "crates/rorpc-macros", version = "0.1.0" }
rorpc-parse = { path = "crates/rorpc-parse", version = "0.1.0" }
