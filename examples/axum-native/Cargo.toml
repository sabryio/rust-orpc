[package]
name = "axum-native-example"
version = "0.1.0"
edition = "2021"
description = "Example: plain Axum handlers annotated with #[orpc] for auto-router and TypeScript contract generation"

[[bin]]
name = "axum-native"
path = "src/main.rs"

[dependencies]
orpc         = { path = "../../crates/orpc" }
axum         = { version = "0.8", features = ["macros"] }
tokio        = { version = "1", features = ["full"] }
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
tower-http   = { version = "0.7", features = ["cors"] }
