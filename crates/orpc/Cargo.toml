[package]
name = "orpc"
version = "0.1.0"
edition = "2021"
authors = ["rust-orpc contributors"]
license = "MIT OR Apache-2.0"
description = "orpc — unified facade for handler metadata, auto-router, and TypeScript contract generation"
repository = "https://github.com/yourusername/rust-orpc"
keywords = ["rpc", "axum", "typescript", "codegen", "openapi"]
categories = ["web-programming", "api-bindings"]

[dependencies]
orpc-macros = { path = "../orpc-macros", version = "0.1.0" }
inventory = "0.3"
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
