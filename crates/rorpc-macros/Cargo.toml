[package]
name = "rorpc-macros"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Procedural macros for rorpc — thin bridge over rorpc-parse"
documentation = "https://docs.rs/rorpc-macros"
readme = "README.md"
keywords = ["rpc", "axum", "codegen", "typescript", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers", "web-programming"]
include = ["src/**/*", "README.md", "Cargo.toml"]

[lib]
proc-macro = true

[dependencies]
rorpc-parse = { workspace = true }
syn = { workspace = true }
proc-macro2 = { workspace = true }
