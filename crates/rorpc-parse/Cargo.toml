[package]
name = "rorpc-parse"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "AST parsing utilities and code generation internals for rorpc proc macros"
documentation = "https://docs.rs/rorpc-parse"
readme = "README.md"
keywords = ["rpc", "axum", "codegen", "typescript", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers", "web-programming"]
include = ["src/**/*", "README.md", "Cargo.toml"]

[dependencies]
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
inventory = "0.3"
