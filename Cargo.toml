[workspace]
members = [
    "crates/rorpc",
    "crates/rorpc-macros",
    "crates/rorpc-parse",
    "examples/axum-react/server",
    "examples/axum-react/better-auth-integration",
]
resolver = "3"

[workspace.dependencies]
rorpc = { path = "crates/rorpc" }
rorpc-macros = { path = "crates/rorpc-macros" }
rorpc-parse = { path = "crates/rorpc-parse" }
