[package]
name = "orpc-axum"
version = "0.1.0"
edition = "2021"
authors = ["rust-orpc contributors"]
license = "MIT OR Apache-2.0"
description = "Axum integration for orpc-core - convert type-safe RPC procedures into Axum routers"
repository = "https://github.com/yourusername/rust-orpc"
keywords = ["rpc", "axum", "api", "web"]
categories = ["web-programming", "api-bindings"]

[features]
default = []
better-auth = ["dep:better-auth"]

[dependencies]
orpc-core = { path = "../orpc-core", version = "0.1.0" }
axum = { version = "0.8.9", features = ["macros"] }
serde_json = "1.0"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors"] }
futures-core = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
futures = "0.3"

# Optional: Better-Auth integration
better-auth = { version = "1.0.0-alpha.2", optional = true, features = [
    "axum",
    "seaorm2",
] }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
