[package]
name = "orpc-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.7.1", features = ["cors"] }
futures = "0.3"
