[package]
name = "orpc-parse"
version = "0.1.0"
edition = "2024"
authors = ["rust-orpc contributors"]
description = "AST parsing utilities and code generation for orpc proc macros"
license = "MIT OR Apache-2.0"

[dependencies]
syn        = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
quote      = "1.0"
proc-macro2 = "1.0"
inventory  = "0.3"
