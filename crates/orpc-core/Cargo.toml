[package]
name = "orpc-core"
version = "0.1.0"
edition = "2021"
authors = ["rust-orpc contributors"]
license = "MIT OR Apache-2.0"
description = "Type-safe RPC procedure abstractions for Rust"
repository = "https://github.com/yourusername/rust-orpc"
keywords = ["rpc", "api", "procedures", "type-safe"]
categories = ["web-programming", "api-bindings"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-core = "0.3"
async-trait = "0.1"
orpc-macros = { path = "../orpc-macros", version = "0.1.0" }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt"] }
async-stream = "0.3"
